[versions]
activity-compose = "1.10.1"
android-gradle-plugin = "8.8.2"
compose-bom = "2025.02.00"
core-ktx = "1.15.0"
kotlin = "2.1.0"
tv-material = "1.0.0"

[libraries]
getair-iptv = { module = "com.getair:iptv", version = "0.1.0-SNAPSHOT" }
getair-stremio-addon-client = { module = "com.getair:stremio-addon-client", version = "0.1.0-SNAPSHOT" }
getair-video = { module = "com.getair:video", version = "0.1.0-SNAPSHOT" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
