name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v7
        with:
          path: design
      - uses: actions/checkout@v7
        with:
          repository: get-air/stremio-addon-client
          path: stremio-addon-client
      - uses: actions/checkout@v7
        with:
          repository: get-air/iptv
          path: iptv
      - uses: actions/checkout@v7
        with:
          repository: get-air/video
          path: video
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./gradlew :app:assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: air-tv-design-debug
          path: design/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
