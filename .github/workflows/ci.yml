name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v7
        with:
          path: design
      - name: Check out public contract repositories
        run: |
          git clone --depth 1 https://github.com/get-air/stremio-addon-client.git ../stremio-addon-client
          git clone --depth 1 https://github.com/get-air/iptv.git ../iptv
          git clone --depth 1 https://github.com/get-air/video.git ../video
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./gradlew :app:assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: ${{ env.ACT != 'true' }}
        with:
          name: air-tv-design-debug
          path: design/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
